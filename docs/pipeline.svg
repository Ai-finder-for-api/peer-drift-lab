<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="260" viewBox="0 0 1100 260" role="img" aria-labelledby="title"><title id="title">Dependency upgrade QA: trace, compare, plan and explicitly simulate</title><rect width="1100" height="260" rx="20" fill="#101c30"/><g font-family="Arial,sans-serif"><text x="30" y="43" fill="white" font-size="23" font-weight="bold">DEPENDENCY UPGRADE / EVIDENCE, NOT GUARANTEES</text><g fill="#20344f" stroke="#4a7294"><rect x="30" y="75" width="235" height="110" rx="12"/><rect x="295" y="75" width="235" height="110" rx="12"/><rect x="560" y="75" width="235" height="110" rx="12"/><rect x="825" y="75" width="245" height="110" rx="12"/></g><g fill="#76e1cd" font-size="20" font-weight="bold"><text x="48" y="108">01 / Trace</text><text x="313" y="108">02 / Compare</text><text x="578" y="108">03 / Plan</text><text x="843" y="108">04 / Simulate</text></g><g fill="#dbe7f3" font-size="15"><text x="48" y="140">AST import locations</text><text x="48" y="163">ESM + CommonJS</text><text x="313" y="140">Export + signature drift</text><text x="313" y="163">JSON / SARIF findings</text><text x="578" y="140">Exact peer candidates</text><text x="578" y="163">Bounded version search</text><text x="843" y="140">Disposable Docker copy</text><text x="843" y="163">Explicit tests + cleanup</text></g><g fill="#76e1cd" font-size="23"><text x="271" y="137">→</text><text x="536" y="137">→</text><text x="801" y="137">→</text></g><text x="30" y="227" fill="#b5c8dc" font-size="16">Static findings + peer constraints + test results → an informed upgrade decision</text></g></svg>
